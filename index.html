<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>情绪急救站 🩹</title>
<!-- v2.9.20260416 - 真实动态篝火效果 -->
<style>
  :root {
    --bg-deep: #141420;
    --bg-card: rgba(255,255,255,0.06);
    --bg-card-hover: rgba(255,255,255,0.1);
    --warm-1: #f8b4b4;
    --warm-2: #f7c9a8;
    --warm-3: #f9e4b7;
    --warm-4: #b8d8ba;
    --warm-5: #a8c8e8;
    --warm-6: #c4b8e8;
    --text-primary: #f0ece6;
    --text-secondary: rgba(240,236,230,0.55);
    --text-dim: rgba(240,236,230,0.3);
    --accent: #f8b4b4;
    --radius: 20px;
    --radius-sm: 14px;
    --radius-full: 50px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 背景氛围 ===== */
  .atmosphere {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .atmosphere .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    animation: blobFloat 10s ease-in-out infinite;
  }
  .blob-1 { width:280px; height:280px; background:var(--warm-1); top:-100px; right:-80px; }
  .blob-2 { width:220px; height:220px; background:var(--warm-6); bottom:15%; left:-60px; animation-delay:4s; }
  .blob-3 { width:180px; height:180px; background:var(--warm-5); bottom:-40px; right:10%; animation-delay:7s; }
  @keyframes blobFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(10px,-20px) scale(1.05); }
    66% { transform: translate(-10px,10px) scale(0.97); }
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.15; }
    50% { opacity: 0.6; }
  }

  /* ===== 页面系统 ===== */
  .page {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    transition: opacity 0.5s ease, transform 0.5s ease;
    will-change: opacity, transform;
    overflow: hidden;
  }
  .page.hidden {
    opacity: 0;
    transform: translateY(20px) scale(0.98);
    pointer-events: none !important;
  }
  .page.hidden * {
    pointer-events: none !important;
  }
  .page.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* ===== 首屏 ===== */
  .home-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.35rem 0.8rem;
    border-radius: 20px;
    background: rgba(248,180,180,0.1);
    border: 1px solid rgba(248,180,180,0.15);
    font-size: 0.75rem;
    color: var(--warm-1);
    margin-bottom: 1.8rem;
  }
  .hero-icon {
    font-size: 3.5rem;
    margin-bottom: 1.2rem;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .hero-title {
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    line-height: 1.6;
    margin-bottom: 0.6rem;
    letter-spacing: 0.01em;
  }
  .hero-sub {
    font-size: 0.88rem;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.8;
    margin-bottom: 2.5rem;
    max-width: 280px;
  }
  .hero-stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .hero-stat {
    text-align: center;
  }
  .hero-stat .num {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--warm-1);
  }
  .hero-stat .label {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }

  /* ===== 按钮 ===== */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.95rem 2.2rem;
    border: none;
    border-radius: var(--radius-full);
    background: linear-gradient(135deg, var(--warm-1), var(--warm-2));
    color: var(--bg-deep);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 4px 25px rgba(248,180,180,0.25);
    letter-spacing: 0.02em;
    font-family: inherit;
  }
  .btn-primary:hover { transform: scale(1.04) translateY(-2px); box-shadow: 0 8px 35px rgba(248,180,180,0.35); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.7rem 1.5rem;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-full);
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s ease;}
  .btn-ghost:hover { background: rgba(255,255,255,0.05); }

  /* 急救页面按钮区域 - 自然跟随文案 */
  .aid-actions {
    padding: 1.5rem 1rem 2rem;
    margin-top: auto;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.25); color: var(--text-primary); }

  /* ===== 情绪选择页 ===== */
  .emotion-page-inner {
    width: 100%;
    max-width: 380px;
  }
  .emotion-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .emotion-header .hint {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 0.4rem;
  }

  .emotion-list {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .emotion-item {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1rem 1.1rem;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    background: var(--bg-card);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    -webkit-user-select: none;
    user-select: none;
  }
  .emotion-item:hover {
    border-color: rgba(255,255,255,0.12);
    background: var(--bg-card-hover);
    transform: translateX(4px);
  }
  .emotion-item:active { transform: scale(0.98); }
  .emotion-item .emoji {
    font-size: 1.5rem;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }
  .emotion-item .info { flex: 1; }
  .emotion-item .info .name {
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 0.15rem;
  }
  .emotion-item .info .desc {
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .emotion-item .tag {
    font-size: 0.65rem;
    padding: 0.2rem 0.5rem;
    border-radius: 8px;
    background: rgba(248,180,180,0.1);
    color: var(--warm-1);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .emotion-item .tag.cool { background: rgba(168,200,232,0.1); color: var(--warm-5); }
  .emotion-item .tag.warm { background: rgba(184,216,186,0.1); color: var(--warm-4); }

  /* 紧急按钮 */
  .emotion-item.emergency {
    border-color: rgba(248,180,180,0.2);
    background: rgba(248,180,180,0.05);
    margin-top: 0.5rem;
  }

  .emotion-back {
    text-align: center;
    margin-top: 1.2rem;
  }

  /* ===== 急救页面 ===== */
  .aid-scroll {
    width: 100%;
    max-width: 400px;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    padding: 2rem 1.5rem;
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
  }
  .aid-content {
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .aid-scene-tag {
    display: inline-flex;
    padding: 0.25rem 0.7rem;
    border-radius: 8px;
    font-size: 0.72rem;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    margin-bottom: 1rem;
  }
  .aid-emoji {
    font-size: 3rem;
    margin-bottom: 0.8rem;
    animation: gentle-bounce 2.5s ease-in-out infinite;
  }
  @keyframes gentle-bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .aid-message {
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 1.8;
    margin-bottom: 0.5rem;
    letter-spacing: 0.01em;
  }
  .aid-science {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 1.8rem;
  }
  .aid-science span {
    color: var(--warm-4);
  }

  /* ===== 互动组件 ===== */

  /* 呼吸引导 */
  .breath-guide {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
  }
  .breath-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    position: relative;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .breath-circle .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(248,180,180,0.2);
    transition: all 1s ease;
  }
  .breath-circle .ring.inhale {
    transform: scale(1.25);
    border-color: rgba(248,180,180,0.5);
    box-shadow: 0 0 40px rgba(248,180,180,0.15);
  }
  .breath-circle .ring.hold {
    transform: scale(1.25);
    border-color: rgba(249,228,183,0.5);
    box-shadow: 0 0 40px rgba(249,228,183,0.15);
  }
  .breath-circle .ring.exhale {
    transform: scale(0.85);
    border-color: rgba(168,200,232,0.4);
  }
  .breath-circle .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(248,180,180,0.6);
    transition: all 1s ease;
    z-index: 1;
  }
  .breath-circle .ring.inhale .dot,
  .breath-circle .dot.inhale-dot { transform: scale(1.5); background: rgba(248,180,180,0.9); }
  .breath-circle .dot.exhale-dot { transform: scale(0.7); background: rgba(168,200,232,0.7); }

  /* 吸/呼文字标签 - 圆圈中央 */
  .breath-label {
    position: relative;
    z-index: 2;
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--text-secondary);
    letter-spacing: 0.15em;
    transition: opacity 0.8s ease, color 0.8s ease;
    pointer-events: none;
    user-select: none;
  }
  .breath-label.inhale-label { color: rgba(248,180,180,0.9); }
  .breath-label.exhale-label { color: rgba(168,200,232,0.8); }

  /* 暖光光晕 - 睡眠场景，像被毯子包裹的温暖感 */
  .moon-glow {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 2rem auto;
    background: radial-gradient(circle, rgba(240,200,160,0.3) 0%, rgba(220,180,140,0.15) 40%, transparent 70%);
    box-shadow: 0 0 60px rgba(220,180,140,0.2), 0 0 120px rgba(200,160,120,0.1);
    animation: moonBreath 8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes moonBreath {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 0.9; }
  }

  .breath-text {
    font-size: 1rem;
    color: var(--text-secondary);
    min-height: 1.5em;
    transition: all 0.3s;
  }
  .breath-count {
    font-size: 2rem;
    font-weight: 700;
    color: var(--warm-1);
    margin-top: 0.2rem;
    font-variant-numeric: tabular-nums;
  }
  .breath-rounds {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 0.5rem;
  }

  /* 5-4-3-2-1 着陆法 */
  .grounding-steps {
    text-align: left;
    margin: 1rem 0 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .grounding-step {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.9rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.4s ease;
  }
  .grounding-step.active {
    border-color: rgba(248,180,180,0.3);
    background: rgba(248,180,180,0.06);
  }
  .grounding-step.done {
    border-color: rgba(184,216,186,0.3);
    background: rgba(184,216,186,0.06);
  }
  .grounding-step .g-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    background: rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .grounding-step.active .g-icon { background: rgba(248,180,180,0.15); }
  .grounding-step.done .g-icon { background: rgba(184,216,186,0.15); }
  .grounding-step .g-text {
    font-size: 0.88rem;
    line-height: 1.4;
    color: var(--text-secondary);
  }
  .grounding-step.active .g-text { color: var(--text-primary); }
  .grounding-step.done .g-text { color: var(--warm-4); }

  .grounding-action-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 2rem;
    border-radius: var(--radius-full);
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-primary);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    margin: 0.5rem auto 1.5rem;
  }
  .grounding-action-btn:hover { background: var(--bg-card-hover); }

  /* 拥抱自己 */
  .hug-visual {
    font-size: 3.5rem;
    margin: 1rem auto;
    animation: hug 3.5s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @keyframes hug {
    0%,100% { transform: scale(1); letter-spacing: 0; }
    20% { transform: scale(1.04) rotate(-2deg); }
    40% { transform: scale(0.93) rotate(0deg); letter-spacing: -6px; }
    60% { transform: scale(0.93); letter-spacing: -6px; }
    80% { transform: scale(1.04) rotate(2deg); }
  }

  /* 用户反馈组件 */
  .feedback-section {
    margin-top: 2rem;
    margin-bottom: 2rem;
    padding: 1.2rem;
    border-radius: var(--radius);
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }
  .feedback-title {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 0.8rem;
  }
  .feedback-buttons {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 0.8rem;
  }
  .feedback-btn {
    padding: 0.5rem 1rem;
    border-radius: var(--radius-full);
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .feedback-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }
  .feedback-btn.active {
    background: rgba(248,180,180,0.15);
    border-color: rgba(248,180,180,0.3);
    color: var(--warm-1);
  }
  .feedback-textarea {
    width: 100%;
    padding: 0.8rem;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.2);
    color: var(--text-primary);
    font-size: 0.85rem;
    font-family: inherit;
    resize: none;
    margin-bottom: 0.6rem;
  }
  .feedback-textarea::placeholder { color: var(--text-dim); }
  .feedback-submit {
    padding: 0.6rem 1.5rem;
    border-radius: var(--radius-full);
    border: none;
    background: linear-gradient(135deg, var(--warm-1), var(--warm-2));
    color: var(--bg-deep);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
  }
  .feedback-submit:hover { transform: scale(1.03); }
  .feedback-thanks {
    font-size: 0.9rem;
    color: var(--warm-4);
    padding: 1rem;
  }

  /* 肌肉放松 */
  .muscle-guide {
    text-align: left;
    margin: 1rem 0 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .muscle-step {
    padding: 0.8rem 1rem;
    border-radius: var(--radius-sm);
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06);
    font-size: 0.88rem;
    color: var(--text-secondary);
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    transition: all 0.4s ease;
  }
  .muscle-step .m-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    flex-shrink: 0;
    margin-top: 0.1rem;
    font-weight: 600;
  }
  .muscle-step.active {
    border-color: rgba(249,228,183,0.3);
    background: rgba(249,228,183,0.06);
    color: var(--text-primary);
  }
  .muscle-step.active .m-num { background: rgba(249,228,183,0.2); }

  .muscle-btn {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 2.2rem;
    border-radius: var(--radius-full);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    margin: 0.5rem auto 1.5rem;
    border: none;
  }
  .muscle-btn.tense {
    background: linear-gradient(135deg, var(--warm-1), var(--warm-2));
    color: var(--bg-deep);
    box-shadow: 0 4px 20px rgba(248,180,180,0.2);
  }
  .muscle-btn.release {
    background: linear-gradient(135deg, var(--warm-4), var(--warm-5));
    color: var(--bg-deep);
    box-shadow: 0 4px 20px rgba(184,216,186,0.2);
  }

  /* 认知重建卡片 */
  .rethink-card {
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 1.3rem;
    margin: 1rem 0 1.5rem;
    text-align: left;
  }
  .rethink-card .label {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.6rem;
  }
  .rethink-card .negative {
    font-size: 0.88rem;
    color: rgba(248,180,180,0.6);
    line-height: 1.6;
    margin-bottom: 0.8rem;
    padding: 0.6rem 0.8rem;
    background: rgba(248,180,180,0.05);
    border-radius: var(--radius-sm);
    border-left: 2px solid rgba(248,180,180,0.2);
  }
  .rethink-card .arrow {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin: 0.5rem 0;
  }
  .rethink-card .positive {
    font-size: 0.92rem;
    color: var(--warm-4);
    line-height: 1.6;
    padding: 0.6rem 0.8rem;
    background: rgba(184,216,186,0.05);
    border-radius: var(--radius-sm);
    border-left: 2px solid rgba(184,216,186,0.3);
    font-weight: 500;
  }

  .rethink-nav {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .rethink-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: all 0.3s;
  }
  .rethink-dot.active {
    background: var(--warm-1);
    width: 20px;
    border-radius: 4px;
  }

  /* 写下来释放 */
  .release-textarea {
    width: 100%;
    min-height: 100px;
    background: var(--bg-card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius);
    padding: 1rem;

function generateSleepStars(){
  const container = document.getElementById('sleepStarsContainer');
  if (!container) return;

  // 生成60颗星星，分布在屏幕上半部分
  const starCount = 60;
  for(let i = 0; i < starCount; i++){
    const star = document.createElement('div');
    star.className = 'sleep-star';
    const size = Math.random() * 2.5 + 1; // 1-3.5px
    const top = Math.random() * 70; // 只分布在上半部分（0-70%）
    const left = Math.random() * 100;
    const delay = Math.random() * 5;
    const duration = 2 + Math.random() * 4; // 2-6秒闪烁周期
    
    star.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      top: ${top}%;
      left: ${left}%;
      animation: sleepStarTwinkle ${duration}s ease-in-out infinite;
      animation-delay: ${delay}s;
    `;
    container.appendChild(star);
  }

  // 添加2-3颗流星（随机时机）
  for(let i = 0; i < 3; i++){
    const meteor = document.createElement('div');
    meteor.className = 'sleep-star';
    const size = Math.random() * 2 + 1;
    const top = Math.random() * 30;
    const left = 70 + Math.random() * 30;
    const delay = 30 + Math.random() * 60; // 30-90秒后开始
    
    meteor.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      top: ${top}%;
      left: ${left}%;
      opacity: 0;
      animation: meteor 1s ease-out forwards;
      animation-delay: ${delay}s;
    `;
    meteor.style.setProperty('transform', 'translateX(0) translateY(0)');
    container.appendChild(meteor);
  }
}

      }

      @keyframes meteor {

        100% { opacity: 0; }

function startGentleSleep(){
  // 生成满天繁星
  generateSleepStars();

  // 篝火声 - 温暖陪伴（主音轨）
  SoundEngine.play('fireplace');
  SoundEngine.setVolume(0.20);

  // 雨声层 - 白噪音+雨声（背景层）
  addTimer(setTimeout(() => {
    SoundEngine.playLayer('rain-drops', 0.12);
  }, 2000));

  const lines = document.querySelectorAll('#sleepLines p');
  const fireGlow = document.querySelector('.fire-glow');
  
  // 19行文案，缓慢浮现（配合5分钟音乐）
  const delays = [800, 4000, 8000, 13000, 18000, 23000, 29000, 35000, 42000, 49000, 56000, 64000, 72000, 80000, 88000, 96000, 105000, 114000, 124000];
  delays.forEach((delay, i) => {
    addTimer(setTimeout(() => {
      const el = document.getElementById('sleepL' + (i + 1));
      if (el) el.classList.add('show');
    }, delay));
  });
  
  // 90秒后开始屏幕微暗，营造睡眠氛围
  const startTime = performance.now();
  addTimer(setInterval(() => {
    if (!document.getElementById('sleepLines')) return;
    const elapsed = (performance.now() - startTime) / 1000;
    const page = document.getElementById('page-aid');
    if (!page) return;
    
    if (elapsed > 90 && elapsed <= 180) {
      // 90-180秒：逐渐变暗
      const darkness = (elapsed - 90) / 90 * 0.5;
      page.style.background = 'rgba(15,15,20,' + darkness + ')';
    } else if (elapsed > 180) {
      // 180秒后：几乎全黑，但微光还在
      page.style.background = 'rgba(15,15,20,0.7)';
    }
  }, 500));

  // 4分钟后文字渐隐，只留最后几行
  addTimer(setTimeout(() => {
    lines.forEach((line, index) => {
      // 保留最后4行（篝火在/我在/你也在/就这样）
      if (index < lines.length - 4) {
        line.style.transition = 'opacity 8s ease-out';
        line.style.opacity = '0';
      }
    });
  }, 240000));

  // 5分02秒音乐结束时，文字消失，显示鼓励语
  addTimer(setTimeout(() => {
    lines.forEach((line, index) => {
      line.style.transition = 'opacity 6s ease-out';
      line.style.opacity = '0';
    });
    // 文字完全消失后，显示鼓励语
    addTimer(setTimeout(() => {
      const encouragement = document.getElementById('sleepEncouragement');
      if (encouragement) {
        encouragement.style.opacity = '1';
      }
    }, 6000));
  }, 302000));

  // 篝火慢慢变柔和
  addTimer(setTimeout(() => {
    if (fireGlow) {
      fireGlow.style.transition = 'opacity 10s ease-out';
      fireGlow.style.opacity = '0.6';
    }
  }, 180000));
}

function startGentleAnxious(){

  const today = new Date().toDateString();
  const storageKey = 'anxiety_count_' + today;
  let anxietyCount = parseInt(localStorage.getItem(storageKey) || '0');
  anxietyCount++;
  localStorage.setItem(storageKey, anxietyCount.toString());

  // 根据频率设置提示语
  const freqHintEl = document.getElementById('axL0');
  if (freqHintEl) {
    if (anxietyCount === 1) {
      freqHintEl.textContent = '';
      freqHintEl.style.display = 'none';
    } else if (anxietyCount <= 3) {
      freqHintEl.textContent = '今天有点辛苦';
    } else {
      freqHintEl.textContent = '这种模式持续一段时间了';
    }
  }

  const delays = [800, 3000, 5500, 8000, 11000, 15000, 19000, 24000, 30000, 36000, 42000, 48000, 54000, 60000, 66000, 72000];

function startGentleDown(){
  // 生成星星
  const scene = document.querySelector('.down-scene');
  if (scene) {
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'down-star';
      star.style.cssText = 'left:' + Math.random()*100 + '%;top:' + Math.random()*70 + '%;width:' + (Math.random()*2+1) + 'px;height:' + (Math.random()*2+1) + 'px;animation-delay:' + Math.random()*3 + 's;animation-duration:' + (2+Math.random()*2) + 's';
      scene.appendChild(star);
    }
  }

  // 篝火声 - 温暖陪伴
  SoundEngine.play('fireplace');
  SoundEngine.setVolume(0.20);

  // 不能说的秘密钢琴曲，2秒后渐入
  addTimer(setTimeout(() => {
    SoundEngine.playLayer('piano-secret', 0.15);
  }, 2000));

  // 31行文案，配合5分02秒（302000ms）音乐
  // 文字节奏：开头稍快建立连接 → 中间身体扫描 → 呼吸练习 → 结尾留白
  const delays = [1000, 3000, 5500, 8500, 12000, 16000, 21000, 27000, 34000, 42000, 50000, 58000, 66000, 74000, 82000, 90000, 98000, 106000, 114000, 122000, 130000, 138000, 146000, 154000, 162000, 170000, 178000, 186000, 194000, 202000, 210000];
  const scrollContainer = document.querySelector('.aid-scroll');
  delays.forEach((delay, i) => {
    addTimer(setTimeout(() => {
      const el = document.getElementById('downL' + i);
      if (el) {
        el.classList.add('show');
        // 自动滚动到可见区域
        if (scrollContainer && el.offsetTop > scrollContainer.scrollTop + scrollContainer.clientHeight * 0.6) {
          scrollContainer.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
        }
      }
    }, delay));
  });

  // 文案淡暗——从早期内容开始，让内容依次隐去
  const dimPairs = [
    [50000, 'downL1'], [60000, 'downL2'], [70000, 'downL3'], [80000, 'downL4'], [90000, 'downL5'],
    [100000, 'downL6'], [110000, 'downL7'], [120000, 'downL8'], [130000, 'downL9'], [140000, 'downL10'],
    [150000, 'downL11'], [160000, 'downL12'], [170000, 'downL13'], [180000, 'downL14'], [190000, 'downL15'],
    [200000, 'downL16'], [210000, 'downL17'], [220000, 'downL18'], [230000, 'downL19']
  ];
  dimPairs.forEach(([delay, id]) => {
    addTimer(setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.classList.add('dim');
    }, delay));
  });

  // 5分02秒（302000ms）音乐结束时，文字同步淡出，然后显示鼓励语
  const musicDuration = 302000;
  const fadeOutDuration = 10000; // 10秒淡出

  addTimer(setTimeout(() => {
    // 文字淡出
    const linesContainer = document.getElementById('downLines');
    if (linesContainer) {
      linesContainer.style.transition = 'opacity 10s ease-out';
      linesContainer.style.opacity = '0';
    }
    // 音乐同步淡出
    SoundEngine.setVolume(0.02);
    addTimer(setTimeout(() => {
      SoundEngine.forceStop();
    }, fadeOutDuration));
  }, musicDuration));

  // 文字消失后（约312秒），显示鼓励语
  addTimer(setTimeout(() => {
    const encouragement = document.getElementById('downEncouragement');
    if (encouragement) {
      encouragement.style.opacity = '1';
    }
  }, musicDuration + fadeOutDuration + 2000));
}

function startGentlePeoplePleaser(){

  const delays = [800, 6000, 14000, 24000, 36000, 50000, 66000, 85000];
  const scrollContainer = document.querySelector('.aid-scroll');
  delays.forEach((delay, i) => {
    addTimer(setTimeout(() => {
      const el = document.getElementById('ppL' + (i + 1));
      if (el) {
        el.classList.add('show');
        if (scrollContainer && el.offsetTop > scrollContainer.scrollTop + scrollContainer.clientHeight * 0.6) {
          scrollContainer.scrollTo({ top: el.offsetTop - 100, behavior: 'smooth' });
        }
      }
    }, delay));
  });

  // 文案淡暗（时间对应新的节奏）
  const dimPairs = [[20000, 'ppL1'], [28000, 'ppL2'], [40000, 'ppL3'], [58000, 'ppL5'], [72000, 'ppL6'], [90000, 'ppL8']];
  dimPairs.forEach(([delay, id]) => {
    addTimer(setTimeout(() => {
      const el = document.getElementById(id);
      if (el) el.classList.add('dim');
    }, delay));
  });

  // 文字显示完后（约1分25秒），提示音乐还在继续
  addTimer(setTimeout(() => {
    const musicHint = document.getElementById('ppMusicHint');
    if (musicHint) {
      musicHint.style.opacity = '1';
    }
  }, 95000));

  // 音乐结束时（4分50秒开始淡出），文字消失后显示鼓励语
  addTimer(setTimeout(() => {
    const linesContainer = document.getElementById('peoplepleaserLines');
    const musicHint = document.getElementById('ppMusicHint');
    if (linesContainer) {
      linesContainer.style.transition = 'opacity 6s ease-out';
      linesContainer.style.opacity = '0';
    }
    if (musicHint) {
      musicHint.style.transition = 'opacity 6s ease-out';
      musicHint.style.opacity = '0';
    }
    // 文字完全消失后，显示鼓励语
    addTimer(setTimeout(() => {
      const encouragement = document.getElementById('ppEncouragement');
      if (encouragement) {
        encouragement.style.opacity = '1';
      }
    }, 6000));
  }, 290000));
}

// ===== 全局变量 =====
let currentScene = null; // 当前场景，用于反馈

// ===== 声音引擎（播放本地音频文件，支持 mp3/ogg/wav） =====

const SoundEngine = (() => {
  let currentType = null;
  let audioEl = null;
  let bgLayer = null; // 叠加的背景层（低音量）
  let vol = 0.4;

  // 音频文件映射（相对于 HTML 文件的路径）
  const soundFiles = {
    'rain-drops': 'rain-drops.mp3',
    'calm-music': 'calm-music.mp3',
    'sleep-music': 'deep-sleep-music.mp3',
    'fireplace': 'fireplace.mp3',
    'healing-music': 'healing-music.mp3',
    'rainbow-piano': 'rainbow-piano.mp3',
    'deep-sleep-music': 'deep-sleep-music.mp3',
    'soul-healing-music': 'soul-healing-music.mp3',
    'piano-secret': 'piano-secret.mp3',
    'piano-dandelion': 'piano-dandelion.mp3'
  };

  function play(type) {
    // 先强制停掉当前播放
    forceStop();

    const file = soundFiles[type];
    if (!file) return;

    audioEl = new Audio(file);
    // 冥想引导不循环，其他声音循环
    audioEl.loop = (type !== 'sleep-music');
    audioEl.volume = 0;
    // 冥想引导播完后的回调
    if (type === 'sleep-music') {
      audioEl.addEventListener('ended', () => {
        // 自动过渡到雨滴白噪音（渐入）
        currentType = null;
        audioEl = null;
        play('rain-drops');
      });
    }
    audioEl.play().then(() => {
      // 渐入 2秒
      audioEl.volume = 0.01;
      let t = 0;
      const step = 20; // 20ms 一步
      const total = 2000;
      const iv = setInterval(() => {
        t += step;
        if (t >= total) { clearInterval(iv); audioEl.volume = vol; }
        else { audioEl.volume = vol * (t / total); }
      }, step);
    }).catch(e => {
      console.warn('Audio play failed:', e);
    });

    currentType = type;
    document.querySelectorAll('.sound-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.sound === type);
    });
  }

  // 叠加播放一个低音量背景层（不替换主音轨）
  function playLayer(type, layerVol) {
    stopLayer();
    const file = soundFiles[type];
    if (!file) return;

    bgLayer = new Audio(file);
    bgLayer.loop = false;
    bgLayer.volume = 0;
    bgLayer.play().then(() => {
      // 慢慢渐入，3秒
      let t = 0;
      const step = 30;
      const total = 3000;
      const iv = setInterval(() => {
        t += step;
        if (t >= total) { clearInterval(iv); bgLayer.volume = layerVol || 0.15; }
        else { bgLayer.volume = (layerVol || 0.15) * (t / total); }
      }, step);
    }).catch(e => console.warn('Layer audio failed:', e));
  }

  function stopLayer() {
    if (bgLayer) {
      // 渐出
      const el = bgLayer;
      const cur = el.volume;
      let t = 0;
      const step = 30;
      const total = 1000;
      const iv = setInterval(() => {
        t += step;
        if (t >= total) { clearInterval(iv); el.pause(); el.currentTime = 0; }
        else { el.volume = cur * (1 - t / total); }
      }, step);
      bgLayer = null;
    }
  }

  function forceStop() {
    if (audioEl) {
      audioEl.pause();
      audioEl.currentTime = 0;
      audioEl = null;
    }
    if (bgLayer) {
      bgLayer.pause();
      bgLayer.currentTime = 0;
      bgLayer = null;
    }
    currentType = null;
    document.querySelectorAll('.sound-chip').forEach(c => c.classList.remove('active'));
  }

  function stop() {
    forceStop();
  }

  function setVolume(v) {
    vol = v;
    if (audioEl) audioEl.volume = v;
    if (bgLayer) bgLayer.volume = v * 0.7; // 音乐始终比白噪音略低
  }

  return {
    play,
    playLayer,
    stopLayer,
    stop,
    setVolume,
    get currentSound() { return currentType; }
  };
})();

function toggleSound(type) {
  if (SoundEngine.currentSound === type) { SoundEngine.stop(); }
  else { SoundEngine.play(type); }
}
function setSoundVolume(v) { SoundEngine.setVolume(v); }
